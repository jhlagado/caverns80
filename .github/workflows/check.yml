name: Caverns CP/M checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: caverns-cpm
          path: |
            build/CAVERNS.COM
            build/manifest.json
            build/CAVERNS.d8.json
            build/symbols.json
